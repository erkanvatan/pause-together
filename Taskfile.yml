version: '3'

env:
  # Containers run as you, so files they write into the repo aren't owned by root.
  # Not UID/GID: shells treat UID as read-only.
  HOST_UID:
    sh: id -u
  HOST_GID:
    sh: id -g

vars:
  DEV: docker compose -f compose.dev.yml
  # Tasks that use it depend on go:image, so a Dockerfile change reaches them without a manual rebuild.
  GO: '{{.DEV}} run --rm --no-deps api'
  NODE: '{{.DEV}} run --rm --no-deps web'

tasks:
  dev:
    desc: Dev stack with hot reload at http://localhost:5173
    deps: [web:deps]
    cmds:
      - '{{.DEV}} up --build'

  test:
    desc: All unit tests (Go + web), in Docker
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    desc: 'Go tests. Pass go test args after --, e.g. task test:go -- -run TestRoutes ./internal/api'
    # Real-ffmpeg tests need the clips; they fail, not skip, when the clips are missing.
    deps: [go:image, testdata]
    cmds:
      - '{{.GO}} go test {{.CLI_ARGS | default "./..."}}'

  test:web:
    desc: 'Web tests. Pass a path after --, e.g. task test:web -- src/lib/sync'
    deps: [web:deps]
    cmds:
      - '{{.NODE}} npm test -- {{.CLI_ARGS}}'

  testdata:
    desc: Make tiny test clips with ffmpeg, in Docker (skipped when they're newer than the script)
    deps: [go:image]
    status:
      - test testdata/media/.done -nt testdata/make.sh
    cmds:
      - '{{.GO}} sh testdata/make.sh'

  demo:
    desc: Record the README's demo (docs/demo.webp), in Docker. Downloads a 276 MB film once
    deps: [build, go:image]
    vars:
      OUT: .cache/demo
      PLAYWRIGHT: >-
        docker run --rm --user "$HOST_UID:$HOST_GID" -e HOME=/tmp -e npm_config_cache=/src/.cache/npm
        -e OUT=/src/.cache/demo -v .:/src
      # Its Playwright version must match docs/demo/package.json.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
    cmds:
      - mkdir -p {{.OUT}}
      - >-
        test -f "{{.OUT}}/media/Movies/Big Buck Bunny (2008)/Big Buck Bunny (2008).mp4" ||
        {{.PLAYWRIGHT}} {{.PLAYWRIGHT_IMAGE}} sh /src/docs/demo/film.sh /src/{{.OUT}}
      # A throwaway app on the prod image: no ports, its database in memory, so every run starts empty
      # and nothing touches the real server or library.
      - docker rm -f pausetogether-demo >/dev/null 2>&1 || true
      - >-
        docker run -d --name pausetogether-demo --user "$HOST_UID:$HOST_GID"
        --tmpfs "/data:uid=$HOST_UID,gid=$HOST_GID" -v ./{{.OUT}}/media:/media:ro pausetogether:latest
      - defer: docker rm -f pausetogether-demo >/dev/null
      # Sharing the app's network: its ports are localhost to the browser.
      - >-
        {{.PLAYWRIGHT}} --network container:pausetogether-demo -w /src/docs/demo {{.PLAYWRIGHT_IMAGE}}
        sh -c "npm ci --no-audit --no-fund && node record.mjs"
      - '{{.GO}} sh docs/demo/webp.sh {{.OUT}}'
      - ls -lh docs/demo.webp

  lint:
    desc: golangci-lint, svelte-check
    deps: [go:image, web:deps]
    cmds:
      - '{{.GO}} golangci-lint run'
      - '{{.NODE}} npm run check'

  build:
    desc: Build the production image
    cmds:
      - docker compose build

  up:
    desc: Build and start the production stack
    dotenv: ['.env']
    preconditions:
      - sh: test -n "$DATA_DIR"
        msg: Set DATA_DIR in .env (template .env.example)
      - sh: test -n "$MEDIA_ROOT"
        msg: Set MEDIA_ROOT in .env (template .env.example)
    cmds:
      # Made here, so it's owned by you. Compose won't make it (create_host_path: false): Docker would
      # make it as root.
      - |
        dir=$DATA_DIR
        case $dir in "~/"*) dir=$HOME/${dir#"~/"} ;; esac
        mkdir -p "$dir"
      # --build, so up never starts a stale image. Docker's cache makes it quick when nothing changed.
      - docker compose up -d --build

  down:
    desc: Stop the production stack
    cmds:
      - docker compose down

  logs:
    desc: Follow the production logs
    cmds:
      - docker compose logs -f

  web:deps:
    internal: true
    desc: npm ci, only when package-lock.json changed
    status:
      # npm writes this hidden lockfile on every install. Skipping when it's current means npm ci
      # never wipes node_modules under a running dev server.
      - test web/node_modules/.package-lock.json -nt web/package-lock.json
    cmds:
      - '{{.NODE}} npm ci'

  go:image:
    internal: true
    desc: Build the Go dev image (cached, so quick when nothing changed)
    # Once per task run, though test:go and testdata both need it.
    run: once
    cmds:
      - '{{.DEV}} build api'
