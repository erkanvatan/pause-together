# Production. Settings come from .env (template: .env.example).
name: pausetogether

services:
  app:
    build: .
    image: pausetogether:latest
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      # Guest port: only as open as PUBLIC_BIND. Docker bypasses ufw.
      - "${PUBLIC_BIND:-127.0.0.1}:${GUEST_PORT:-8420}:8080"
      # Admin port: this machine only.
      - "127.0.0.1:${ADMIN_PORT:-8421}:8081"
    volumes:
      # Long syntax, so a missing folder fails here instead of Docker creating it as root, which the
      # app (running as you) couldn't write to.
      - type: bind
        source: ${DATA_DIR:?set DATA_DIR in .env}
        target: /data
        bind:
          create_host_path: false
      # All media, read-only: the app never writes into media folders.
      - type: bind
        source: ${MEDIA_ROOT:?set MEDIA_ROOT in .env}
        target: /media
        read_only: true
        bind:
          create_host_path: false
